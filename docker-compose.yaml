services:
  postgres:
    image: 'postgres:15'
    restart: on-failure
    ports:
      - '5432:5432'
    volumes:
      - ./Data/Database/Data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  object-store:
    image: 'minio/minio:RELEASE.2025-04-22T22-12-26Z'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - type: bind
        source: ./Data/Object-store
        target: /data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_USER}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_PASSWORD}
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"